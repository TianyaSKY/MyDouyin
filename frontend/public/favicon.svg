<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#0F0F1A" />
    </linearGradient>
    <!-- 播放键渐变 -->
    <linearGradient id="play_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FE2C55" />
      <stop offset="100%" stop-color="#FF9933" />
    </linearGradient>
    <!-- AI星标渐变 -->
    <linearGradient id="ai_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25F4EE" />
      <stop offset="100%" stop-color="#92FE9D" />
    </linearGradient>
    <!-- 发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 底部圆角图标底板 -->
  <rect x="10" y="10" width="100" height="100" rx="25" fill="url(#bg_grad)" />
  
  <!-- 雷达/推荐算法波纹 -->
  <circle cx="60" cy="60" r="35" fill="none" stroke="#33334A" stroke-width="2" stroke-dasharray="6 4" />
  <circle cx="60" cy="60" r="23" fill="none" stroke="#33334A" stroke-width="2" />
  
  <!-- 发光的中心播放按钮 -->
  <path d="M50 43 L76 60 L50 77 Z" fill="url(#play_grad)" filter="url(#glow)"/>
  
  <!-- AI 火花/智能推荐元素 -->
  <path d="M80 25 Q82 35 92 37 Q82 39 80 49 Q78 39 68 37 Q78 35 80 25 Z" fill="url(#ai_grad)" />
  <path d="M35 75 Q36 81 42 82 Q36 83 35 89 Q34 83 28 82 Q34 81 35 75 Z" fill="url(#ai_grad)" opacity="0.8" />
</svg>
