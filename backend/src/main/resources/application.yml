server:
  port: ${BACKEND_PORT:8081}

springdotenv:
  directory: ..
  filename: .env

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:douyin}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USER:douyin_user}
    password: ${MYSQL_PASSWORD:douyin_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:user}
    password: ${RABBITMQ_PASSWORD:password}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-attempts: 3
        default-requeue-rejected: false

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.douyin.entity

logging:
  level:
    org.mybatis: WARN
    com.baomidou.mybatisplus: WARN
    org.springframework.jdbc: WARN

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000   # 7 days in ms (single token mode)

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  media-base-url: ${MEDIA_BASE_URL:http://localhost:8081}
  upload:
    base-dir: ../storage
    temp-dir: tmp
    video-dir: videos
    url-prefix: /uploads/videos/
    cover-dir: covers
    cover-url-prefix: /uploads/covers/

# Milvus Configuration
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}

# Recommend Service Configuration (FastAPI)
recommend:
  service:
    url: ${RECOMMEND_SERVICE_URL:http://${RECOMMEND_HOST:localhost}:${RECOMMEND_PORT:8082}}
    timeout: ${RECOMMEND_SERVICE_TIMEOUT:5000}
    retry: ${RECOMMEND_SERVICE_RETRY:3}
